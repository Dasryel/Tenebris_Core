name: Code Quality Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4    

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0 # Match your project version

    - name: Restore dependencies
      run: dotnet restore

    - name: Build and Lint
       # /warnaserror treats all warnings (including linting ones) as errors
      run: dotnet build --configuration Release --no-restore /warnaserror